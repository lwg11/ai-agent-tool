name: daily-checkin

# 每日定时签到（ikuuu + 稀土掘金）
# 触发策略：北京时间 6:07 / 7:23 各抽签一次（40% 概率执行），
#          8:07 / 8:23 / 8:39 保底必跑（防其中某个触发被 GitHub 丢弃），
#          20:07 晚间兜底必跑（上午触发全被丢弃或签到全失败时的最后一道网）；
#          当天已有成功记录时，后续触发（含 cron 延迟导致的迟到触发）一律秒退跳过，
#          保证每天只记一次。
# 时区说明：GitHub Actions cron 只支持 UTC（北京 = UTC+8）。
# 延迟优化：整点（minute=0）是全 GitHub 排队高峰，实测延迟可达 1~3 小时；
#          全部改为非整点分钟（7/23/39），保底点提前到 8:07，即使迟到约 50 分钟仍在 9 点前。
# 失败重试：执行签到步骤最多尝试 3 次（间隔 60 秒），只重试失败的工具，
#          已成功的工具不再重复提交签到请求（结果按工具合并，任一次成功即计成功）。
on:
  schedule:
    - cron: '7 22 * * *'  # 北京 6:07 抽签
    - cron: '23 23 * * *' # 北京 7:23 抽签
    - cron: '7 0 * * *'   # 北京 8:07 保底必跑
    - cron: '23 0 * * *'  # 北京 8:23 保底必跑（备用）
    - cron: '39 0 * * *'  # 北京 8:39 保底必跑（第三备点）
    - cron: '7 12 * * *'  # 北京 20:07 晚间兜底必跑（当天未成功时补签；已成功则幂等秒退）
  workflow_dispatch: # 支持在 Actions 页面手动触发（用于测试，必跑）
    inputs:
      only:
        description: 执行范围（控制台「执行签到」按钮也走这里）
        type: choice
        options:
          - all
          - ikuuu
          - juejin
        default: all

concurrency:
  group: daily-checkin
  cancel-in-progress: false

permissions:
  contents: write # 写回 checkin-history.json 供控制台页面展示

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # 预留 3 次尝试（含 60 秒间隔）+ Playwright 安装的余量

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 随机抽签（含当日幂等检查）
        id: dice
        run: |
          # 时间统一按北京时间计算：date -u -d '+8 hours' 不依赖 TZ 环境变量
          # （TZ=Asia/Shanghai 写法在部分环境会失效退回 UTC，导致日期/小时全错）
          BJ_DATE=$(date -u -d '+8 hours' +%F)
          BJ_HOUR=$(date -u -d '+8 hours' +%H)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "手动/控制台触发，必跑"
            echo "go=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # 幂等保护：GitHub cron 延迟会让 6/7/8/9 点的触发全部迟到，
          # 若今天（北京时间）已有成功的签到记录，迟到的触发一律跳过（当天全部失败时仍会重试）
          HIST=$(curl -sf --max-time 20 -H "Accept: application/vnd.github.raw" \
            "https://api.github.com/repos/${{ github.repository }}/contents/checkin-history.json?ref=main" || echo "")
          ALREADY=$(printf '%s' "$HIST" | node -e '
            let s = "";
            process.stdin.on("data", d => s += d).on("end", () => {
              let h = [];
              try { h = JSON.parse(s); } catch (e) {}
              const today = process.argv[1];
              console.log(Array.isArray(h) && h.some(r => r && r.date === today && r.allOk === true) ? "yes" : "no");
            });
          ' "$BJ_DATE")
          if [ "$ALREADY" = "yes" ]; then
            echo "今天（$BJ_DATE）已有成功的签到记录，本次为 cron 延迟的迟到触发，跳过"
            echo "go=false" >> "$GITHUB_OUTPUT"
          elif [ $((10#$BJ_HOUR)) -ge 8 ]; then
            echo "已过北京 8 点且今天尚未成功签到，保底必跑（上午保底目标 9 点前完成；晚间 20:07 为最后一道网）"
            echo "go=true" >> "$GITHUB_OUTPUT"
          elif [ $(( RANDOM % 100 )) -lt 40 ]; then
            echo "抽中（40% 概率），本次执行"
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "未抽中，本次跳过，等下个时段"
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 安装 Node.js
        if: steps.dice.outputs.go == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 安装 Playwright 与 Chromium（掘金浏览器签到用）
        if: steps.dice.outputs.go == 'true'
        run: |
          npm install playwright --no-fund --no-audit
          npx playwright install --with-deps chromium

      - name: 写入 ikuuu 配置（来自 Secret）
        if: steps.dice.outputs.go == 'true'
        env:
          IKUUU_CONFIG: ${{ secrets.IKUUU_CONFIG_JSON }}
        run: |
          if [ -z "$IKUUU_CONFIG" ]; then
            echo "::error::Secret IKUUU_CONFIG_JSON 未配置，请在仓库 Settings > Secrets and variables > Actions 中添加"
            exit 1
          fi
          printf '%s' "$IKUUU_CONFIG" > ikuuu-checkin/config.json

      - name: 写入掘金配置（来自 Secret）
        if: steps.dice.outputs.go == 'true'
        env:
          JUEJIN_CONFIG: ${{ secrets.JUEJIN_CONFIG_JSON }}
        run: |
          if [ -z "$JUEJIN_CONFIG" ]; then
            echo "::error::Secret JUEJIN_CONFIG_JSON 未配置，请在仓库 Settings > Secrets and variables > Actions 中添加"
            exit 1
          fi
          printf '%s' "$JUEJIN_CONFIG" > juejin-checkin/config.json

      - name: 执行签到（失败自动重试，只重试失败项）
        if: steps.dice.outputs.go == 'true'
        run: |
          set -o pipefail
          ONLY="${{ github.event.inputs.only || 'all' }}"
          : > checkin.log
          attempt=1; max=3; rc=1; range="$ONLY"
          while [ "$attempt" -le "$max" ]; do
            echo "" | tee -a checkin.log
            echo "===== 第 $attempt/$max 次执行（范围: $range）=====" | tee -a checkin.log
            if [ "$range" = "all" ]; then
              node run-all.js 2>&1 | tee -a checkin.log; rc=${PIPESTATUS[0]}
            else
              node run-all.js --only="$range" 2>&1 | tee -a checkin.log; rc=${PIPESTATUS[0]}
            fi
            cp checkin-result.json "checkin-result-try${attempt}.json" 2>/dev/null || true
            [ "$rc" -eq 0 ] && break
            [ "$attempt" -eq "$max" ] && break
            # 计算下次重试范围：只跑失败的工具，上次成功的不再重复提交签到请求
            next=""
            if [ -f checkin-result.json ]; then
              next=$(node -e '
                try {
                  const r = require("./checkin-result.json");
                  console.log((r.tools || []).filter(t => !t.ok).map(t => t.key).join(","));
                } catch (e) { console.log(""); }
              ')
            fi
            if [ -z "$next" ]; then
              if [ -f checkin-result.json ] && node -e 'process.exit(require("./checkin-result.json").allOk ? 0 : 1)'; then
                echo "上一次尝试已全部成功，无需重试" | tee -a checkin.log
                rc=0; break
              fi
              next="$range" # 结果文件缺失（run-all 未写出）时整体重试
            fi
            echo ">>> 失败项: $next —— 60 秒后仅重试失败项（已成功项不再提交请求）" | tee -a checkin.log
            sleep 60
            attempt=$((attempt + 1)); range="$next"
          done
          # 合并各次尝试结果：每个工具取任一次成功即为成功；时间取最后一次执行（完成时刻）
          node -e '
            const fs = require("fs");
            const files = fs.readdirSync(".").filter(f => /^checkin-result-try\d+\.json$/.test(f)).sort();
            if (!files.length) process.exit(0);
            const first = JSON.parse(fs.readFileSync(files[0], "utf8"));
            const last = JSON.parse(fs.readFileSync(files[files.length - 1], "utf8"));
            const tools = {};
            for (const f of files) {
              const r = JSON.parse(fs.readFileSync(f, "utf8"));
              for (const t of r.tools || []) if (!tools[t.key] || t.ok) tools[t.key] = t;
            }
            first.tools = Object.values(tools);
            first.allOk = first.tools.length > 0 && first.tools.every(t => t.ok);
            first.runAt = last.runAt; first.bjTime = last.bjTime;
            fs.writeFileSync("checkin-result.json", JSON.stringify(first, null, 2) + "\n");
            console.log("[retry-merge] 合并 " + files.length + " 次尝试结果，allOk=" + first.allOk);
          '
          exit "$rc"

      - name: 生成运行摘要（显示在 Summary 页）
        if: always() && steps.dice.outputs.go == 'true'
        run: |
          {
            echo "## 📋 每日签到结果"
            echo ""
            if [ -f checkin.log ]; then
              echo '```text'
              cat checkin.log
              echo '```'
            else
              echo "⚠️ 未找到签到日志（执行签到步骤未运行或提前失败）"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 写回签到历史（供控制台页面展示）
        if: always() && steps.dice.outputs.go == 'true'
        env:
          CHECKIN_TRIGGER: ${{ github.event_name }} # schedule / workflow_dispatch
        run: |
          node scripts/merge-history.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add checkin-history.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(checkin): 更新签到历史 [skip ci]"
            git push
          else
            echo "历史无变化，跳过提交"
          fi

      - name: 清理凭证文件
        if: always()
        run: rm -f ikuuu-checkin/config.json juejin-checkin/config.json checkin.log checkin-result.json checkin-result-try*.json
