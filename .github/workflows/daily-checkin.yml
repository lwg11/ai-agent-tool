name: daily-checkin

# 每日定时签到（ikuuu + 稀土掘金）
# 时区说明：GitHub Actions cron 只支持 UTC，北京时间 10:00 = UTC 01:00。
# 注意：GitHub 定时任务可能有 0~30 分钟的触发延迟，属正常现象。

on:
  schedule:
    - cron: '0 1 * * *' # 每天北京时间上午 10 点左右
  workflow_dispatch: # 支持在 Actions 页面手动触发（用于测试）

concurrency:
  group: daily-checkin
  cancel-in-progress: false

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 写入 ikuuu 配置（来自 Secret）
        env:
          IKUUU_CONFIG: ${{ secrets.IKUUU_CONFIG_JSON }}
        run: |
          if [ -z "$IKUUU_CONFIG" ]; then
            echo "::error::Secret IKUUU_CONFIG_JSON 未配置，请在仓库 Settings > Secrets and variables > Actions 中添加"
            exit 1
          fi
          printf '%s' "$IKUUU_CONFIG" > ikuuu-checkin/config.json

      - name: 写入掘金配置（来自 Secret）
        env:
          JUEJIN_CONFIG: ${{ secrets.JUEJIN_CONFIG_JSON }}
        run: |
          if [ -z "$JUEJIN_CONFIG" ]; then
            echo "::error::Secret JUEJIN_CONFIG_JSON 未配置，请在仓库 Settings > Secrets and variables > Actions 中添加"
            exit 1
          fi
          printf '%s' "$JUEJIN_CONFIG" > juejin-checkin/config.json

      - name: 执行签到
        run: |
          set -o pipefail
          node run-all.js 2>&1 | tee checkin.log
          exit ${PIPESTATUS[0]}

      - name: 生成运行摘要（显示在 Summary 页）
        if: always()
        run: |
          {
            echo "## 📋 每日签到结果"
            echo ""
            if [ -f checkin.log ]; then
              echo '```text'
              cat checkin.log
              echo '```'
            else
              echo "⚠️ 未找到签到日志（执行签到步骤未运行或提前失败）"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 清理凭证文件
        if: always()
        run: rm -f ikuuu-checkin/config.json juejin-checkin/config.json checkin.log
